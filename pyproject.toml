[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-guardian"
version = "1.0.0"
description = "Automated maintenance and cost-optimization daemon for Delta Lake tables"
authors = [{ name = "Delta Guardian Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "deltalake>=0.17.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "pyarrow>=14.0.0",
]

[project.scripts]
delta-guardian = "main:cli"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
